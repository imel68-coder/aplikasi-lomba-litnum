# Netlify Configuration for GELORA 26 (SMP Negeri 26 Sijunjung)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--legacy-peer-deps"

# Single Page Application (SPA) redirect rule
# Ensures client-side routing works without 404 errors on reload
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache control for assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
